set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys vi

# Prefix key: C-s
unbind C-b
set -g prefix C-s
bind -N "Send the prefix key through to the application" C-s send-prefix

set -g mouse on
set -s escape-time 0
set -g history-limit 100000

set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:RGB"
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"

# Reload configuration
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Window titles & automatic rename
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Ben's custom overrides & Vim style navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Resize panes
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Renumber windows sequentially
set -g renumber-windows on

# Status bar styling
set -g status-position bottom
set -g status-interval 5
set -g status-style bg='#666666',fg='#aaaaaa'
set -g status-left ""
set -g status-right '#[fg=green]|#[fg=white]%m/%d %H:%M'

# Split windows keeping current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy mode (vi)
bind-key -T copy-mode-vi 'v' send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy || xclip -sel clip -i'"
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi V send -X rectangle-toggle

# Local configuration override
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'
