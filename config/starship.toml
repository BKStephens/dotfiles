add_newline = false
command_timeout = 200
format = "$directory$git_branch$git_status$character"

[character]
error_symbol = "[✗](bold red) "
success_symbol = "[❯](bold blue) "

[directory]
style = "bold blue"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold blue"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
format = "[$path]($style) "

[git_branch]
format = "[$branch]($style) "
style = "bold green"

[git_status]
format     = '[$all_status]($style)'
style      = "bold green"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
